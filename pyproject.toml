[project]
name = "foodvision-1-0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "kaggle>=1.7.4.5",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.16.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodvision"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
